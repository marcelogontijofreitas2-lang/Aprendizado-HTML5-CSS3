<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Got';
            src: url(fonts/BLACEB__.TTF) format('truetype'), url(fonts/Blacklettersh.ttf) format('truetyope');
            font-weight: normal;
            font-style: normal;
        /*
        Tipos de format()
        -opentype (otf)
        -truetype(ttf) 
        -embedded-opentype
        -truetype-aat (Applpe Advanced Typography)
        -svg
        */    
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            font-family: 'Got', 'Times New Roman', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Neque quibusdam quasi ducimus eum laborum maiores dolorum voluptatum! Sint dolores voluptate dolor nesciunt ex natus sequi, voluptates debitis aliquam enim ipsum.</p>
</body>
</html>
